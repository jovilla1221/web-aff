<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekomendasi kazeera.id</title>
  <meta name="description" content="Daftar rekomendasi produk kazeera.id — Pilihan terbaik di Shopee.">
  <meta name="keywords" content="Rekomendasi kazeera.id, Kawat Bulu, Fashion, Shopee Affiliate">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Rekomendasi kazeera.id">
  <meta property="og:description" content="Daftar rekomendasi produk kazeera.id — Pilihan terbaik di Shopee.">
  <meta property="og:type" content="website">

  <!-- Favicon / Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="container">
    
    <!-- Cute Pink Site Header -->
    <header class="site-header">
      <div class="banner-card">
        <h1 class="site-title">Rekomendasi kazeera.id</h1>
      </div>
    </header>

    <!-- Main Content: Catalog Category Filter & Product List -->
    <main>
      <!-- Dynamic Category Tabs -->
      <nav id="category-tabs" class="category-tabs" aria-label="Katalog Kategori">
        <button onclick="filterCategory('all')" class="category-tab active" id="tab-all">Semua</button>
      </nav>

      <!-- Product List Container -->
      <div id="product-list" class="product-list" aria-label="Daftar Rekomendasi Produk">
        <!-- Loading State -->
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Memuat rekomendasi produk...</p>
        </div>
      </div>
    </main>

    <!-- Footer & Affiliate Disclosure -->
    <footer class="site-footer">
      <div class="disclosure-card">
        <strong>Affiliate Disclosure</strong><br>
        Beberapa link di website ini merupakan link affiliate Shopee. Kami dapat menerima komisi apabila Anda melakukan pembelian melalui link tersebut tanpa biaya tambahan bagi Anda.
      </div>
      <div class="footer-credits">
        <p>&copy; <span id="year"></span> Rekomendasi kazeera.id. All rights reserved.</p>
      </div>
    </footer>

  </div>

  <!-- Vanilla JS Script -->
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let allProducts = [];
    let categoriesList = [];
    let activeCategory = 'all';

    async function fetchCategories() {
      try {
        const res = await fetch('/api/categories');
        if (res.ok) {
          categoriesList = await res.json();
          renderCategoryTabs();
        }
      } catch (err) {
        console.error('Error fetching categories:', err);
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      let html = `<button onclick="filterCategory('all')" class="category-tab ${activeCategory === 'all' ? 'active' : ''}" id="tab-all">Semua</button>`;

      categoriesList.forEach(cat => {
        html += `
          <button onclick="filterCategory('${escapeHtml(cat.id)}')" 
                  class="category-tab ${activeCategory === cat.id ? 'active' : ''}" 
                  id="tab-${escapeHtml(cat.id)}">
            ${escapeHtml(cat.name)}
          </button>
        `;
      });

      container.innerHTML = html;
    }

    async function fetchProducts() {
      const container = document.getElementById('product-list');
      try {
        const response = await fetch('/api/products');
        if (!response.ok) {
          throw new Error('Gagal mengambil data produk');
        }
        allProducts = await response.json();
        renderProducts();
      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="empty-state">
            <p>Maaf, terjadi kendala saat memuat rekomendasi produk.</p>
            <button onclick="fetchProducts()" class="btn btn-secondary btn-sm" style="margin-top: 12px;">Coba Lagi</button>
          </div>
        `;
      }
    }

    function filterCategory(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById('product-list');

      let filtered = allProducts;
      if (activeCategory !== 'all') {
        filtered = allProducts.filter(p => p.category === activeCategory);
      }

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>Belum ada produk rekomendasi pada katalog ini.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((product) => `
        <a href="${escapeHtml(product.affiliate_url)}" 
           class="product-link-item" 
           target="_blank" 
           rel="nofollow sponsored"
           title="Buka ${escapeHtml(product.title)} di Shopee">
          <span class="product-title">${escapeHtml(product.title)}</span>
          <span class="arrow-badge" aria-hidden="true">↗</span>
        </a>
      `).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Load categories & products on start
    fetchCategories();
    fetchProducts();
  </script>

</body>
</html>
